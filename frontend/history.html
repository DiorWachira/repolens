<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>repolens / scan history</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="repolens home"><span class="brand-mark" aria-hidden="true">/</span><span>repolens</span></a>
        <nav class="nav-links" aria-label="Dashboard navigation"><a href="./">Dashboard</a></nav>
        <div class="topbar-meta"><span class="live-dot"></span><span>session archive</span></div>
      </header>
      <main>
        <section class="history-hero">
          <p class="eyebrow">This browser session</p>
          <h1>Scan history</h1>
          <p class="lede">Reopen a saved repository report or export a copy. History is cleared when this browser session ends.</p>
        </section>
        <section class="history-page-toolbar">
          <span id="historySummary">0 saved scans</span>
          <button class="clear-button" id="clearHistory" type="button">Clear history</button>
        </section>
        <section class="history-page-list" id="historyList" aria-live="polite"></section>
        <section class="history-report" id="reportView" hidden>
          <div class="report-heading"><div><p class="eyebrow">Selected report</p><h2 id="reportTitle">Repository</h2></div><div class="report-actions"><button id="markdownButton" type="button">Download MD</button><button id="pdfButton" type="button">Print PDF</button></div></div>
          <div class="report-score" id="reportScore"></div>
          <div class="report-checks" id="reportChecks"></div>
        </section>
      </main>
      <footer class="site-footer"><span>repolens 0.1.0</span><span>session data only</span></footer>
    </div>
    <script src="history.js"></script>
  </body>
</html>
